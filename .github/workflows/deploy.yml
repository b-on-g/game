name: $bog_game_arcade

permissions: write-all

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - uses: browser-actions/setup-chrome@v1
      id: chrome
      with:
        chrome-version: stable

    - name: Point the probe at Chrome
      run: |
        set -euo pipefail
        test -x "${{ steps.chrome.outputs.chrome-path }}"
        echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

    - uses: hyoo-ru/mam_build@master2
      with:
        package: 'bog/game'
        modules: 'arcade probe'

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/game/arcade/-'

    - name: URLs
      if: github.ref == 'refs/heads/master'
      run: |
        echo "- https://b-on-g.github.io/game/" >> "$GITHUB_STEP_SUMMARY"
